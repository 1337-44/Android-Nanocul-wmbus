name: Android NanoCUL GPS Logger

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run unit tests and build Android APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoCUL-GPS-Logger-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK in GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; fi
          FILE="app/build/outputs/apk/debug/app-debug.apk"
          cp "$FILE" NanoCUL_GPS_Logger_debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NanoCUL_GPS_Logger_debug.apk --clobber
          else
            gh release create "$TAG" NanoCUL_GPS_Logger_debug.apk --target "$GITHUB_SHA" \
              --title "NanoCUL GPS Logger $TAG" --prerelease \
              --notes "Experimental Android USB OTG / CH340 NanoCUL logger. Debug APK for testing; export logs before reinstalling."
          fi
