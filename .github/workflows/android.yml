name: Android NanoCUL GPS Logger

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build per branch so earlier commits cannot replace a new APK with an old one.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch complete wmbusmeters WebAssembly engine (GPL-3)
        run: bash scripts/install-wmbusmeters-wasm.sh
      - name: Verify upstream WASM decoder against real telegram fixture
        run: node tests/wmbusmeters-wasm-smoke.mjs
      - name: Run unit tests and build Android APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Restore stable Android release signing (optional)
        if: github.event_name == 'push'
        env:
          SIGNING_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_B64" ]]; then
            test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
            printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/nanocul-release.keystore"
            echo "ANDROID_SIGNING_KEYSTORE=$RUNNER_TEMP/nanocul-release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured; publishing test-only DEBUG APK"
          fi
      - name: Build consistently signed release APK when configured
        if: env.ANDROID_SIGNING_KEYSTORE != ''
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoCUL-GPS-Logger-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK in GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(awk '/versionName/ { gsub(/[^0-9A-Za-z._-]/, "", $2); print $2; exit }' app/build.gradle)
          test -n "$VERSION"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [[ -n "${ANDROID_SIGNING_KEYSTORE:-}" ]]; then
            cp app/build/outputs/apk/release/app-release.apk NanoCUL_GPS_Logger.apk
            FILE=NanoCUL_GPS_Logger.apk
            NOTE="Stable-key signed APK. Install on top of a version signed with the same private key."
          else
            cp app/build/outputs/apk/debug/app-debug.apk NanoCUL_GPS_Logger_debug.apk
            FILE=NanoCUL_GPS_Logger_debug.apk
            NOTE="Experimental DEBUG-signed APK. Different workflow runs may use different signing keys. Export logs before reinstalling."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" \
              --title "NanoCUL GPS Logger $TAG" --prerelease \
              --notes "$NOTE"
          fi
